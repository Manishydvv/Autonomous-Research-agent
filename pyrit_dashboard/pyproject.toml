[project]
name = "pyrit-dashboard"
version = "0.1.0"
description = "PyRIT Red Team Dashboard for the Autonomous Research Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.4",
    "pyrit==0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
